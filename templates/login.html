{% extends 'base.html' %}
{% block title %}Login — AeroMiles{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 text-center">
        <div class="mb-4">
            <h2 class="fw-bold">Selamat Datang</h2>
            <p class="text-muted">Masuk ke akun AeroMiles Anda</p>
        </div>

        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-{{ msg.tags }} alert-dismissible fade show text-start">
                    {{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <div class="card shadow-sm border-0 text-start">
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-medium">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="email@example.com" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-medium">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-medium">Log In</button>
                </form>
                <div class="text-center mt-4 text-muted" style="font-size: .9rem;">
                    Belum punya akun? <a href="{% url 'main:register' %}" class="text-decoration-none fw-medium">Daftar di sini</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
